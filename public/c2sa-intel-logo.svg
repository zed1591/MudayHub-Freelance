<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%">
  <defs>
    <linearGradient id="c2saGrad" x1="0%" y1="85%" x2="95%" y2="10%">
      <stop offset="0%" stop-color="#232D3F" />
      <stop offset="40%" stop-color="#2E384D" />
      <stop offset="70%" stop-color="#8E1437" />
      <stop offset="100%" stop-color="#C8102E" />
