      <stop offset="100%" stop-color="#232D3F" />
    </linearGradient>

    <filter id="cortexGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .brand-title {
        font-family: 'Orbitron', 'Rajdhani', 'Eurostile', 'Segoe UI', sans-serif;
        font-size: 62px;
        font-weight: 800;
        fill: #232D3F;
        letter-spacing: 16px;
      }
      [data-theme="dark"] .brand-title {
        fill: #FFFFFF;
      }
      .sup-two {
        font-family: 'Orbitron', 'Rajdhani', 'Segoe UI', sans-serif;
        font-size: 92px;
        font-weight: 800;
        fill: url(#saGrad);
      }
    </style>
  </defs>

